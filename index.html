<!DOCTYPE html>

<head>

<link rel="stylesheet" href="src/styles.css">
<!-- Tous les modules sont demandés en parallèle dès le départ (sinon : chargement en cascade) -->

<script>
  // Thème appliqué avant le premier affichage (évite un flash)
  try { var t = JSON.parse(localStorage.getItem('ardoise.v1') || '{}').prefs; t = t && t.theme;
    if (!t && localStorage.getItem('sk.dark') === '1') t = 'dark';
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <svg viewBox="0 0 64 64" class="logo"><rect width="64" height="64" rx="15" class="logo-bg"/><path class="logo-t" d="M20 20.5 L19.4 43.5 M27.2 20 L26.8 44 M34.4 20.6 L34 43.6 M41.6 20.2 L41.2 43.8"/><path class="logo-x" d="M14.5 39.5 L48 24.5"/></svg>
  <div class="splash-n">Ardoise</div>
</div>

<div class="app">
  <header class="topbar" id="topbar"></header>
  <main class="view" id="view"></main>
  <div class="bar" id="bar"></div>
  <nav class="tabs" id="tabs" aria-label="Navigation principale" hidden>
    <button class="tab" data-act="go" data-to="home" id="tab-home"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6v12M10 6v12M14 6v12M18 6v12M4 15l16-6"/></svg>Parties</button>
    <button class="tab" data-act="go" data-to="players" id="tab-players"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3 3-4.6 5.5-4.6s4.7 1.6 5.5 4.6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.6c2.2 0 3.8 1.3 4.5 3.8"/></svg>Joueurs</button>
  </nav>
</div>

<div class="toast-wrap"><div class="toast" id="toast" role="status" aria-live="polite"></div></div>
<div class="scrim" id="scrim" data-act="sheetClose"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></section>

<script type="module" src="src/app.js"></script>
</body>
</html>
